<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f9">
  <title>Touch Tell Distributors</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone-page">

    <header class="profile-card">
      <img class="profile-logo" src="./logo.jpeg" alt="Touch Tell Distributors logo">
      <h1>Touch Tell Distributors</h1>
      <p>Smart Store QR</p>
      <div class="hours">
        <i class="fa-regular fa-clock"></i>
        <span>Mon–Sat · 9:00 AM–6:00 PM</span>
      </div>
    </header>

    <section class="quick-grid" aria-label="Store links">

      <a class="tile" href="https://www.ttcvape.com/" target="_blank" rel="noopener">
        <span class="icon website"><i class="fa-solid fa-globe"></i></span>
        <span class="label">Website</span>
      </a>

      <a class="tile" href="https://wa.me/19724005359" target="_blank" rel="noopener">
        <span class="icon whatsapp"><i class="fa-brands fa-whatsapp"></i></span>
        <span class="label">WhatsApp</span>
      </a>

      <a class="tile" href="https://www.instagram.com/touchtelldistribution/" target="_blank" rel="noopener">
        <span class="icon instagram"><i class="fa-brands fa-instagram"></i></span>
        <span class="label">Instagram</span>
      </a>

      <a class="tile" href="https://www.facebook.com/touchtell/" target="_blank" rel="noopener">
        <span class="icon facebook"><i class="fa-brands fa-facebook-f"></i></span>
        <span class="label">Facebook</span>
      </a>

      <a class="tile" href="https://www.tiktok.com/@touchtell.distrib?_r=1&_t=ZP-99F15UM1mKl"
         target="_blank" rel="noopener">
        <span class="icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
        <span class="label">TikTok</span>
      </a>

      <a class="tile" href="tel:+19724005359">
        <span class="icon call"><i class="fa-solid fa-phone"></i></span>
        <span class="label">Call</span>
      </a>

      <a class="tile"
         href="https://www.google.com/maps/search/?api=1&query=11430%20Reeder%20Rd%2C%20Dallas%2C%20TX%2075229"
         target="_blank" rel="noopener">
        <span class="icon location"><i class="fa-solid fa-location-dot"></i></span>
        <span class="label">Location</span>
      </a>

      <a class="tile"
         href="https://www.google.com/search?q=Touch+Tell+Communication+%26+Distribution+Dallas+reviews#lrd=0x864c278db49ca6d1:0x79ae1296e4928a33,3,,,,"
         target="_blank" rel="noopener">
        <span class="icon reviews"><i class="fa-solid fa-star"></i></span>
        <span class="label">Google Reviews</span>
      </a>

      <a class="tile"
         href="https://wa.me/19724005359?text=Hello%2C%20I%20need%20help."
         target="_blank" rel="noopener">
        <span class="icon support"><i class="fa-solid fa-headset"></i></span>
        <span class="label">Help</span>
      </a>

      <a class="tile"
         href="https://apps.apple.com/tt/app/touch-tell/id1211113763"
         target="_blank" rel="noopener">
        <span class="icon apple"><i class="fa-brands fa-apple"></i></span>
        <span class="label">iPhone App</span>
      </a>

      <a class="tile" href="#" data-coming-soon="Android App">
        <span class="icon android"><i class="fa-brands fa-google-play"></i></span>
        <span class="label">Android App</span>
      </a>

      <button class="tile share" type="button" id="shareButton">
        <span class="icon share-icon"><i class="fa-solid fa-share-nodes"></i></span>
        <span class="label">Share</span>
      </button>

    </section>

    <section class="address-card">
      <i class="fa-solid fa-location-dot"></i>
      <div>
        <strong>Store Address</strong>
        <span>11430 Reeder Rd, Dallas, TX 75229</span>
      </div>
    </section>

    <p class="footer-note">Tap any icon to connect with us.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
